name: Publish to Threads

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub delays :00 runs the most).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what is due, publish nothing"
        type: boolean
        default: false
      check_connection:
        description: "Only confirm the key reaches the Threads account, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish due posts
        env:
          # zernio (default) or threads; set the repository variable PUBLISH_BACKEND to switch.
          PUBLISH_BACKEND: ${{ vars.PUBLISH_BACKEND || 'zernio' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Images are served from this exact commit, so a later edit can't change a post mid-flight.
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_CONNECTION: ${{ inputs.check_connection }}
        run: |
          if [ "$CHECK_CONNECTION" = "true" ]; then flags="--check"
          elif [ "$DRY_RUN" = "true" ]; then flags="--dry-run"
          else flags=""; fi
          # Both platforms always run; the job reports the worse exit code.
          # --reply-grace: a due reveal is left 45 min to the on-time "Threads answer reveals" routine.
          status=0
          for platform in threads instagram; do
            python tools/publish.py --platform "$platform" $flags --reply-grace 45 --summary-file run-summary.md || {
              code=$?; if [ "$code" -gt "$status" ]; then status=$code; fi; }
          done
          exit $status

      - name: Save the publication log
        if: always() && !inputs.dry_run && !inputs.check_connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log/publications.jsonl log/instagram.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "log: publish run $(date -u +%FT%TZ)"
            for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi

      - name: Open an issue (one per day) so the owner is notified
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Threads publishing problem $(date -u +%F)"
          { cat run-summary.md 2>/dev/null || echo "The run failed before it could write a summary."; echo; echo "Run: $RUN_URL"; } > issue.md
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then gh issue create --title "$title" --body-file issue.md; fi
