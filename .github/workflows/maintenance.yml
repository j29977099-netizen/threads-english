name: Weekly maintenance

on:
  schedule:
    # Mondays 04:17 UTC: refresh the token (threads backend only), then collect last week's metrics.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PUBLISH_BACKEND: ${{ vars.PUBLISH_BACKEND || 'zernio' }}

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh the Threads token (valid 60 days, refreshed weekly)
        id: refresh
        if: env.PUBLISH_BACKEND == 'threads'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python tools/refresh_token.py --out "$RUNNER_TEMP/token"

      - name: Store the token if Meta issued a new value
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Meta issued a new token but GH_SECRETS_PAT is not set."; exit 1; fi
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token"

      - name: Collect last week's metrics
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python tools/insights.py --days 7

      - name: Commit the metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "reports: weekly insights $(date -u +%F)"
            for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi

      - name: Open an issue so the owner is notified
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Weekly maintenance failed $(date -u +%F)" \
            --body "Metrics collection (or the threads token refresh) failed. Run: $RUN_URL"
